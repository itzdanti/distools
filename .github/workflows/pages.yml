name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is published by pushing the built `dist/` to the `gh-pages` branch, so this needs
# write access to the repository contents.
permissions:
  contents: write

# Both this workflow and the release workflow publish `gh-pages`, so they share a group and never
# push at the same time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # esbuild, which Vite uses, is a native module and will not run on this runner without it.
      - run: npm ci

      - run: npm run lint
      - run: npm run test:config
      - run: npm run test:api

      # `build` runs `docs:openapi` and `docs:llms` first, then Vite, then the `postbuild` script
      # that writes `dist/404.html` (the SPA fallback) and `dist/.nojekyll`.
      - run: npm run build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
